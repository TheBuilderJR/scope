[package]
name = "scope"
version = "0.1.0"
description = "Scope - a combined file browser and system monitor"
authors = ["bobrenjc93"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "scope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "scope"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
